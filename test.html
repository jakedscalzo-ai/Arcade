<!DOCTYPE html>

<head>
<title>Arcade - Moota.co</title>
<link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Permanent+Marker">
<style type="text/css">
body { 
    background-color: black; 
    width: 382px; 
    margin: 0px auto; 
    font-family: sans-serif; 
    color: white;
    user-select: none;
    -webkit-user-select: none;
}
#pacman { 
    height: 470px; 
    width: 382px; 
    border-radius: 5px; 
    margin: 10px auto; 
}
#shim { 
    font-family: 'Permanent Marker', cursive; 
    position: absolute; 
    visibility: hidden; 
}
h1 { 
    font-family: 'Permanent Marker', cursive; 
    text-align: center; 
    color: yellow; 
    margin: 10px 0;
}
.back-btn {
    display: block;
    width: 200px;
    margin: 5px auto;
    padding: 10px;
    background-color: yellow;
    color: black;
    text-align: center;
    font-family: 'Permanent Marker', cursive;
    text-decoration: none;
    border-radius: 5px;
    font-size: 16px;
}
#dpad {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(2, 60px);
    gap: 5px;
    justify-content: center;
    margin: 10px auto;
}
.d-btn {
    background-color: #333;
    color: yellow;
    border: 2px solid yellow;
    border-radius: 10px;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    outline: none;
}
.d-btn:active {
    background-color: yellow;
    color: black;
}
#btn-up { grid-column: 2; grid-row: 1; }
#btn-left { grid-column: 1; grid-row: 2; }
#btn-down { grid-column: 2; grid-row: 2; }
#btn-right { grid-column: 3; grid-row: 2; }
</style>
</head>

</div>

// D-Pad Touch/Click Handlers
function sendKey(keyCode) {
    if (typeof game !== 'undefined' && game.keyDown) {
        game.keyDown({ keyCode: keyCode });
    }
}
document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); sendKey(38); });
document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); sendKey(37); });
document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); sendKey(40); });
document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); sendKey(39); });

document.getElementById('btn-up').addEventListener('click', () => sendKey(38));
document.getElementById('btn-left').addEventListener('click', () => sendKey(37));
document.getElementById('btn-down').addEventListener('click', () => sendKey(40));
document.getElementById('btn-right').addEventListener('click', () => sendKey(39));
